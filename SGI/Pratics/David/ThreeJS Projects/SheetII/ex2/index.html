<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parte II — Interação com objetos 3D</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    canvas { display: block; touch-action: none; }
    #painel {
      position: fixed; bottom: 16px; left: 16px; right: 16px;
      width: fit-content; margin: 0; padding: 10px 14px;
      background: #ffffffdf; color: #222; border-radius: 6px;
    }
    #status { margin: 0 0 10px; }
    #acoes { display: flex; flex-wrap: wrap; gap: 8px; border: 0; padding: 0; margin: 0; }
    button { padding: 10px 14px; border: 0; border-radius: 10px; background: white; color: black; font-weight: 600; cursor: pointer; box-shadow: 0 1px 3px #0003; }
    button:disabled { opacity: 0.5; cursor: wait; }
  </style>
</head>
<body>
  <canvas id="myCanvas" aria-label="Cena 3D com cubos selecionáveis"></canvas>
  <div id="painel">
    <p id="status" role="status">A carregar a cena…</p>
    <fieldset id="acoes" disabled aria-label="Alterar cubo grande">
      <button id="btnColor">Mudar Cor</button>
      <button id="btnMaterial">Novo Material</button>
      <button id="btnShadow">Ativar/Desativar Sombra</button>
      <button id="btnHideAndSeek">Esconder/Mostrar</button>
      <button id="btnReset">Repor</button>
    </fieldset>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "../../node_modules/three/build/three.module.js",
        "three/addons/": "../../node_modules/three/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
