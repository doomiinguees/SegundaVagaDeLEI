<!DOCTYPE html>
<html lang="en">
<head>
    <title>JavaScript</title>
    <style>

    #contentor {
        padding: 20px;
        background-color: gray;
    }

    </style>
</head>
<body>
    <div id="contentor">
        <h1>Parágrafo de Texto</h1>

    <button id="btn_cinza">Fundo Cinza</button>
    <button id="btn_verde">Fundo Verde</button>
</body>

<script>
    let container = document.getElementById('contentor');
    let btn_cinza = document.getElementById('btn_cinza');
    let btn_verde = document.getElementById('btn_verde');

    function changeToGreen(){
        container.style.backgroundColor = 'green';
    }

    function changeToGray(){
    }


    btn_cinza.onclick = function() {
        container.style.backgroundColor = 'gray';
    };
    btn_verde.addEventListener('click', function() {
        container.style.backgroundColor = 'green';
    });

    
</script>

</html>
